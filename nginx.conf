# KlickPint — Nginx Configuration
# Save to: /etc/nginx/sites-available/klickpint.online
# Then: ln -s /etc/nginx/sites-available/klickpint.online /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name klickpint.online www.klickpint.online;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name klickpint.online www.klickpint.online;

    # SSL Certificates (Let's Encrypt — run certbot first)
    ssl_certificate     /etc/letsencrypt/live/klickpint.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klickpint.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Static files — served directly by Nginx (bypasses Node for speed).
    # The app serves everything at the site root with no /public/ prefix
    # (e.g. GET /css/app.css -> public/css/app.css), so the location must
    # match the app's real URL layout, not a /public/ path that nothing
    # ever requests. Anything not found here still falls through to the
    # `location /` block below and is served by Node instead.
    location ~* ^/(css|js|blog)/ {
        root       /var/www/klickpint/public;
        expires    1d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|png|jpg|jpeg|ico|webmanifest|xml|txt)$ {
        root       /var/www/klickpint/public;
        expires    1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to Node on port 3020
    location / {
        proxy_pass         http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (for video proxy downloads)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Block /api/stats from public access
    location /api/stats {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:3020;
    }

    # Logging
    access_log /var/log/nginx/klickpint.access.log;
    error_log  /var/log/nginx/klickpint.error.log;
}
