<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Where to place text in a 9:16 Pinterest video so it survives a 2:3 crop</title>
  <rect width="720" height="900" fill="#ffffff"/>

  <!-- 9:16 frame 288 x 512, centred -->
  <rect x="216" y="30" width="288" height="512" rx="22" fill="#e4e4e7"/>
  <!-- 2:3 middle band: 288 x 432, top = 30 + 40 -->
  <rect x="216" y="70" width="288" height="432" fill="#fff1f2" stroke="#e60023" stroke-width="4" stroke-dasharray="12 8"/>
  <!-- face + headline in the middle -->
  <circle cx="360" cy="190" r="46" fill="#fecdd3"/>
  <rect x="250" y="262" width="220" height="34" rx="8" fill="#e60023"/>
  <rect x="276" y="308" width="168" height="22" rx="6" fill="#fb7185"/>
  <!-- pin title / buttons area -->
  <rect x="244" y="440" width="140" height="16" rx="8" fill="#d4d4d8"/>
  <rect x="244" y="466" width="96" height="14" rx="7" fill="#d4d4d8"/>
  <!-- strip markers -->
  <text x="360" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="#71717a">A</text>
  <text x="360" y="530" text-anchor="middle" font-size="22" font-weight="700" fill="#71717a">A</text>
  <text x="488" y="290" text-anchor="middle" font-size="22" font-weight="800" fill="#e60023">B</text>
  <text x="488" y="470" text-anchor="middle" font-size="22" font-weight="800" fill="#52525b">C</text>

  <!-- legend, stacked so it stays readable on a phone -->
  <g font-size="26">
    <rect x="40" y="590" width="40" height="40" rx="8" fill="#e4e4e7"/>
    <text x="60" y="618" text-anchor="middle" font-size="22" font-weight="700" fill="#71717a">A</text>
    <text x="100" y="610" font-weight="700" fill="#18181b">Top and bottom strips</text>
    <text x="100" y="640" font-size="22" fill="#71717a">Can be cut when the feed shows the video as 2:3</text>

    <rect x="40" y="680" width="40" height="40" rx="8" fill="#fff1f2" stroke="#e60023" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="60" y="708" text-anchor="middle" font-size="22" font-weight="800" fill="#e60023">B</text>
    <text x="100" y="700" font-weight="700" fill="#18181b">Middle 2:3 area: safe</text>
    <text x="100" y="730" font-size="22" fill="#71717a">Put headlines, captions and faces here</text>

    <rect x="40" y="770" width="40" height="40" rx="8" fill="#d4d4d8"/>
    <text x="60" y="798" text-anchor="middle" font-size="22" font-weight="800" fill="#52525b">C</text>
    <text x="100" y="790" font-weight="700" fill="#18181b">Lower part: keep it clear</text>
    <text x="100" y="820" font-size="22" fill="#71717a">The pin title and buttons often sit on top of it</text>
  </g>
</svg>
