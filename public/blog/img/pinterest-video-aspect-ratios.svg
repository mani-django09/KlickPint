<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Pinterest video aspect ratios compared: 1:1, 4:5, 2:3 and 9:16</title>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#18181b">Same height, different shapes</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#71717a">The four aspect ratios that work best for Pinterest video</text>

  <!-- baseline y = 360, frame height 250 -->
  <!-- 1:1  w250 -->
  <rect x="60" y="110" width="250" height="250" rx="14" fill="#fff1f2" stroke="#e60023" stroke-width="2.5"/>
  <text x="185" y="242" text-anchor="middle" font-size="34" font-weight="800" fill="#e60023">1:1</text>
  <text x="185" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">Square</text>
  <text x="185" y="414" text-anchor="middle" font-size="13" fill="#71717a">1080 × 1080</text>

  <!-- 4:5  w200 -->
  <rect x="350" y="110" width="200" height="250" rx="14" fill="#fff1f2" stroke="#e60023" stroke-width="2.5"/>
  <text x="450" y="242" text-anchor="middle" font-size="34" font-weight="800" fill="#e60023">4:5</text>
  <text x="450" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">Portrait</text>
  <text x="450" y="414" text-anchor="middle" font-size="13" fill="#71717a">1080 × 1350</text>

  <!-- 2:3  w167 -->
  <rect x="590" y="110" width="167" height="250" rx="14" fill="#e60023" stroke="#e60023" stroke-width="2.5"/>
  <text x="673" y="242" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">2:3</text>
  <text x="673" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">Standard pin</text>
  <text x="673" y="414" text-anchor="middle" font-size="13" fill="#71717a">1000 × 1500</text>

  <!-- 9:16 w141 -->
  <rect x="797" y="110" width="141" height="250" rx="14" fill="#fff1f2" stroke="#e60023" stroke-width="2.5"/>
  <text x="867" y="242" text-anchor="middle" font-size="34" font-weight="800" fill="#e60023">9:16</text>
  <text x="867" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#18181b">Full vertical</text>
  <text x="867" y="414" text-anchor="middle" font-size="13" fill="#71717a">1080 × 1920</text>
</svg>
