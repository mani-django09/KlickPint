<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Where to place text in a 9:16 Pinterest video so it survives a 2:3 crop</title>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- 9:16 frame: 252 x 448 at x=120,y=36 -->
  <rect x="120" y="36" width="252" height="448" rx="18" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="2"/>
  <!-- 2:3 centre band: height = 252*1.5 = 378, top = 36 + (448-378)/2 = 71 -->
  <rect x="120" y="71" width="252" height="378" fill="#fff1f2" stroke="#e60023" stroke-width="2.5" stroke-dasharray="8 6"/>
  <!-- cropped strips -->
  <rect x="120" y="36" width="252" height="35" rx="18" fill="#e4e4e7"/>
  <rect x="120" y="449" width="252" height="35" rx="18" fill="#e4e4e7"/>
  <!-- safe text block -->
  <rect x="150" y="200" width="192" height="26" rx="6" fill="#e60023"/>
  <rect x="170" y="236" width="152" height="18" rx="5" fill="#fb7185"/>
  <circle cx="246" cy="140" r="34" fill="#fecdd3"/>
  <!-- bottom UI hint -->
  <rect x="146" y="404" width="120" height="12" rx="6" fill="#d4d4d8"/>
  <rect x="146" y="424" width="80" height="10" rx="5" fill="#d4d4d8"/>

  <!-- labels -->
  <g font-size="15" fill="#18181b">
    <line x1="380" y1="53" x2="470" y2="53" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="480" y="58" font-weight="700">Top strip can be cut</text>
    <text x="480" y="80" fill="#71717a" font-size="14">when the feed shows the video as 2:3</text>

    <line x1="380" y1="213" x2="470" y2="213" stroke="#e60023" stroke-width="1.5"/>
    <text x="480" y="208" font-weight="700">Headline and faces go here</text>
    <text x="480" y="230" fill="#71717a" font-size="14">The middle 2:3 area (dashed) is shown everywhere</text>

    <line x1="380" y1="418" x2="470" y2="418" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="480" y="413" font-weight="700">Bottom: keep it clear</text>
    <text x="480" y="435" fill="#71717a" font-size="14">Pin title and buttons often sit over this part</text>

    <line x1="380" y1="467" x2="470" y2="467" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="480" y="472" font-weight="700">Bottom strip can be cut too</text>
  </g>
</svg>
